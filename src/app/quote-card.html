<div class="card border-0 shadow-sm rounded-4 h-100">
  <div class="card-body p-4 d-flex flex-column justify-content-center">
    <p class="card-text fs-4 fst-italic text-center mb-3 lh-lg" style="color: #2c3e50;">
      "{{ quote().text }}"
    </p>
    <footer class="text-center text-muted">
      <cite class="fs-6">— {{ quote().author }}</cite>
      @if (quote().category) {
        <span class="ms-2 badge bg-light text-secondary fw-normal">{{ quote().category }}</span>
      }
    </footer>
  </div>
</div>
