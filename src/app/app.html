<div class="min-vh-100 py-4" [style.background]="bgColor()">
  <div class="container-lg">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 fw-bold mb-0">
        <i class="bi bi-quote me-2"></i>Daily Quote
      </h1>
      <button class="btn btn-sm btn-outline-secondary rounded-pill" (click)="toggleTheme()">
        <i class="bi" [class.bi-moon-fill]="!isDark()" [class.bi-sun-fill]="isDark()"></i>
      </button>
    </div>

    <app-low-quote-pool-banner />

    <div class="row g-4 mt-2">
      <div class="col-12 col-lg-7">
        <div class="d-flex flex-column gap-4">
          <app-quote-card [quote]="quoteService.currentQuote()" />
          <app-practice-area />
          <div class="d-block d-lg-none">
            <app-streak-button />
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="d-flex flex-column gap-4">
          <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-flame-fill text-warning fs-3"></i>
            <span class="fs-2 fw-bold" [style.color]="'#2c3e50'">{{ streakService.currentStreak() }}</span>
            <span class="text-muted">day streak</span>
          </div>

          <div class="d-none d-lg-block">
            <app-streak-button />
          </div>

          <app-xp-freeze-widget />
        </div>
      </div>
    </div>
  </div>
</div>
